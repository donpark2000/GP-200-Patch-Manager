name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button for on-demand runs

jobs:
  test:
    name: Regression suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole regression suite is hardware-free (fake/mock MIDI
        # devices only), so it can genuinely run anywhere -- this also
        # doubles as a real check that the portability work (no hardcoded
        # paths, no leftover files) actually holds outside our own machines.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mido python-rtmidi
      - name: Run regression suite
        run: python run_tests.py

  build-executables:
    name: Build standalone executable (${{ matrix.os }})
    needs: test   # only build from a commit that actually passed every test
    strategy:
      fail-fast: false
      matrix:
        # PyInstaller doesn't cross-compile -- a Windows build has to run on
        # a Windows machine, a macOS build on macOS, etc. -- so this needs
        # its own matrix, one native build per platform, not a single job.
        #
        # The Linux entry deliberately targets ubuntu-22.04, not
        # ubuntu-latest (== 24.04 as of this writing). A PyInstaller build
        # links against the build machine's glibc, and glibc binaries only
        # run forward -- something built on a newer glibc refuses to run on
        # an older one ("GLIBC_2.38 not found"), never the other way
        # around. Building on the oldest Ubuntu GitHub still offers
        # (20.04 was retired in April 2025) maximizes how old a real
        # user's Linux install can be and still run this. Found this the
        # hard way: the ubuntu-latest build ran fine in CI but failed on a
        # real, somewhat older Linux VM with exactly that GLIBC error.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mido python-rtmidi pyinstaller
      - name: Build with PyInstaller
        # mido loads its backend (python-rtmidi) dynamically at runtime
        # rather than via a normal top-level import, which PyInstaller's
        # static analysis misses without this hint -- found by testing the
        # built exe, not assumed.
        run: pyinstaller --onefile --name gp200 --hidden-import mido.backends.rtmidi gp200.py
      - name: Upload built executable
        uses: actions/upload-artifact@v4
        with:
          name: gp200-${{ matrix.os }}
          path: ${{ matrix.os == 'windows-latest' && 'dist/gp200.exe' || 'dist/gp200' }}
