name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button for on-demand runs

jobs:
  test:
    name: Regression suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole regression suite is hardware-free (fake/mock MIDI
        # devices only), so it can genuinely run anywhere -- this also
        # doubles as a real check that the portability work (no hardcoded
        # paths, no leftover files) actually holds outside our own machines.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mido python-rtmidi
      - name: Run regression suite
        run: python run_tests.py

  build-executables:
    name: Build standalone executable (${{ matrix.os }})
    needs: test   # only build from a commit that actually passed every test
    strategy:
      fail-fast: false
      matrix:
        # PyInstaller doesn't cross-compile -- a Windows build has to run on
        # a Windows machine, a macOS build on macOS, etc. -- so this needs
        # its own matrix, one native build per platform, not a single job.
        #
        # The Linux entry deliberately targets ubuntu-22.04, not
        # ubuntu-latest (== 24.04 as of this writing). A PyInstaller build
        # links against the build machine's glibc, and glibc binaries only
        # run forward -- something built on a newer glibc refuses to run on
        # an older one ("GLIBC_2.38 not found"), never the other way
        # around. Building on the oldest Ubuntu GitHub still offers
        # (20.04 was retired in April 2025) maximizes how old a real
        # user's Linux install can be and still run this. Found this the
        # hard way: the ubuntu-latest build ran fine in CI but failed on a
        # real, somewhat older Linux VM with exactly that GLIBC error.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mido python-rtmidi pyinstaller
      - name: Build with PyInstaller
        # mido loads its backend (python-rtmidi) dynamically at runtime
        # rather than via a normal top-level import, which PyInstaller's
        # static analysis misses without this hint -- found by testing the
        # built exe, not assumed.
        run: pyinstaller --onefile --name gp200 --hidden-import mido.backends.rtmidi gp200.py
      - name: Upload built executable
        uses: actions/upload-artifact@v4
        with:
          name: gp200-${{ matrix.os }}
          path: ${{ matrix.os == 'windows-latest' && 'dist/gp200.exe' || 'dist/gp200' }}

  publish-latest-release:
    name: Publish "latest" release with built executables
    needs: build-executables
    runs-on: ubuntu-latest
    # Only publish from real pushes to main -- never from a pull request,
    # which wouldn't have permission to do this anyway.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download all built executables
        uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: Rename for clarity and to avoid filename collisions
        # Both the Linux and macOS builds come out of PyInstaller as a bare
        # "gp200" with no OS in the name -- fine as separate CI artifacts
        # (each lives in its own named folder), but they'd overwrite each
        # other if uploaded to the same release without renaming first.
        run: |
          mkdir -p release-assets
          cp dist-all/gp200-windows-latest/gp200.exe release-assets/gp200-windows.exe
          cp dist-all/gp200-ubuntu-22.04/gp200      release-assets/gp200-linux
          cp dist-all/gp200-macos-latest/gp200      release-assets/gp200-macos
      - name: Publish/update the rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (auto-updated)"
          prerelease: true
          body: |
            Automatically built and published by CI from the most recent commit
            on `main` -- not a stable numbered version, just always the current
            state of the project. See the commit history for what's changed.

            The regression suite (hardware-free, no GP-200 needed) passes on
            Ubuntu, Windows, and macOS before this is ever built. The Windows
            build has been confirmed to run standalone on a real machine with
            no Python installed. The Linux and macOS builds succeed in CI but
            have not each been individually confirmed to run correctly outside
            of it -- see the README for known platform-specific notes
            (macOS Gatekeeper, older-glibc Linux systems).
          files: release-assets/*
